services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: analytics
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data

  etl:
    build:
      context: .
      dockerfile: project/Dockerfile
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: analytics
    depends_on: 
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./sql:/app/sql:ro
      - ./pipeline:/app/pipeline:ro
    # CMD from Dockerfile runs load_raw.py then staging_cleaning.sql

volumes:
  db_data: